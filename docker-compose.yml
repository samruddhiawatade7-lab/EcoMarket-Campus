version: '3.8'

services:
  # --------------------------------------------------
  # 1. MySQL 8.0 Relational Database Container
  # --------------------------------------------------
  db:
    image: mysql:8.0
    container_name: ecomarket-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ecomarket_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecomarket-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # 2. Spring Boot 3.2.5 Java 21 Backend API Container
  # --------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecomarket-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ecomarket_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      RAZORPAY_KEY_ID: rzp_test_EcoMarketCampus2026
      RAZORPAY_KEY_SECRET: SecretEcoMarketCampusKey2026
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - ecomarket-network

  # --------------------------------------------------
  # 3. React + Vite + Nginx Frontend SPA Container
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecomarket-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - ecomarket-network

volumes:
  mysql_data:
  backend_uploads:

networks:
  ecomarket-network:
    driver: bridge
